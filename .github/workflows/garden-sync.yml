name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge

      # --- NEW STEP: FORCE EXTRACT ---
      - name: Force Extract Submodule to Physical Folder
        run: |
          # Copy files to a temp location
          mkdir -p temp_notes
          cp -r notes/* temp_notes/
          
          # Remove the 'gitlink' (the submodule pointer)
          git rm -rf notes || rm -rf notes
          
          # Recreate notes/entries as a REAL physical directory
          mkdir -p notes/entries
          cp -r temp_notes/* notes/entries/
          rm -rf temp_notes
      # -------------------------------

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          if [ -d "notes/entries" ]; then
            find notes/entries/ -maxdepth 1 -name "*.md" ! -name "README.md" | sort | while read file; do
              filename=$(basename "$file")
              linkname="notes/entries/${filename%.md}" # Updated path for root basePath
              title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "${filename%.md}")
              echo "* [$title]($linkname)" >> $SIDEBAR_FILE
            done
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # We force add because we want to turn the submodule into a folder
          git add _sidebar.md notes/
          git diff-index --quiet HEAD || (git commit -m "fix: extract submodule to folder and update sidebar" && git push)
