- name: Force Extract Submodule to Physical Folder
        run: |
          # 1. Ensure submodule files are present
          git submodule update --init --recursive
          
          # 2. Create a temporary staging area
          mkdir -p /tmp/garden_staging
          
          # 3. Sync content ONLY (no nesting) to staging
          # This takes everything inside 'notes/' and puts it in staging
          cp -r notes/. /tmp/garden_staging/
          
          # 4. Wipe the 'notes' path from Git's memory entirely
          git rm -rf notes --ignore-unmatch
          rm -rf notes
          
          # 5. Rebuild the physical path
          mkdir -p notes/entries
          
          # 6. Move files back into the target folder
          cp -r /tmp/garden_staging/. notes/entries/
          
          # 7. Final Cleanup of any accidental recursion
          rm -rf notes/entries/entries
          rm -rf notes/entries/notes

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](notes.html#/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # Find all .md files in the new flat folder
          if [ -d "notes/entries" ]; then
            # We use -printf to get just the filename to avoid path issues
            find notes/entries -maxdepth 1 -name "*.md" ! -name "README.md" -exec basename {} \; | sort | while read filename; do
              title=$(grep -m 1 '^# ' "notes/entries/$filename" | sed 's/^# //' || echo "${filename%.md}")
              echo "* [$title](notes/entries/${filename%.md})" >> $SIDEBAR_FILE
            done
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FORCE add the notes folder so Git sees it as a folder, not a submodule
          git add -f notes/
          git add _sidebar.md
          git commit -m "chore: flatten notes structure and update sidebar" || echo "No changes to commit"
          git push origin main
          git diff-index --quiet HEAD || (git commit -m "fix: extract submodule to folder and update sidebar" && git push)
