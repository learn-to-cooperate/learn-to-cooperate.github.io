name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge

      - name: Force Extract Submodule to Physical Folder
        run: |
          # 1. Get the files from the submodule
          git submodule update --init --recursive
          
          # 2. Move them to a safe temporary spot outside the 'notes' path
          mkdir -p /tmp/extracted_notes
          cp -r notes/* /tmp/extracted_notes/
          
          # 3. Completely wipe the 'notes' path (removes the gitlink and the double entries)
          git rm -rf notes || rm -rf notes
          
          # 4. Create the clean target folder
          mkdir -p notes/entries
          
          # 5. Move files from temp into the clean folder
          # We use /tmp/extracted_notes/* to avoid nesting
          cp -r /tmp/extracted_notes/* notes/entries/
          
          # 6. Cleanup temp
          rm -rf /tmp/extracted_notes

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](notes.html#/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # Look specifically in the new clean folder
          if [ -d "notes/entries" ]; then
            find notes/entries/ -maxdepth 1 -name "*.md" ! -name "README.md" | sort | while read file; do
              filename=$(basename "$file")
              # Link relative to notes.html basePath '/'
              echo "* [${filename%.md}](notes/entries/${filename%.md})" >> $SIDEBAR_FILE
            done
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # We force add because we want to turn the submodule into a folder
          git add _sidebar.md notes/
          git diff-index --quiet HEAD || (git commit -m "fix: extract submodule to folder and update sidebar" && git push)
