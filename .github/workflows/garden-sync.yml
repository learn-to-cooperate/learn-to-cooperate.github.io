name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually with a button
  schedule:
    - cron: '0 0 * * *' # This runs every night at midnight (00:00 UTC)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge
          
      - name: Generate Sidebar
        run: |
          # 1. Ensure the directory exists
          mkdir -p notes/entries
          
          SIDEBAR_FILE="notes/entries/_sidebar.md"
          
          # 2. Debugging: List files to see if the submodule actually pulled anything
          echo "Checking for files in notes/entries/..."
          ls -R notes/entries/
          
          # 3. Start the sidebar
          echo "* [🏠 Main Portfolio](../../index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](README.md)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # 4. Find all .md files (excluding the sidebar itself)
          # Using find is more reliable than ls in some environments
          find notes/entries/ -maxdepth 1 -name "*.md" ! -name "_sidebar.md" ! -name "README.md" | sort | while read file; do
            filename=$(basename "$file")
            title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "${filename%.md}")
            echo "* [$title]($filename)" >> $SIDEBAR_FILE
          done
          
          # 5. Debugging: Check if file was actually created
          echo "Content of generated sidebar:"
          cat $SIDEBAR_FILE

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Only commit if there are actually changes
          git diff-index --quiet HEAD || git commit -m "Update notes submodule and sidebar"
          git push