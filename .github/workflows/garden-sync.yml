name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          # Ensure you use a PAT if your notes repo is private
          token: ${{ secrets.MY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge

      - name: Sync Files to Real Folder
        run: |
          # 1. Create target directory
          mkdir -p notes/entries
          
          # 2. Copy contents from submodule to the real folder
          # Assuming your submodule is now named 'notes_submodule'
          if [ -d "notes_submodule/entries" ]; then
            cp -a notes_submodule/entries/. notes/entries/
          else
            echo "Error: notes_submodule/entries not found!"
            exit 1
          fi

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="notes/_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](notes.html#/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # Use find to handle spaces and hidden files
          if [ -d "notes/entries" ]; then
            find notes/entries -name "*.md" | sort | while read -r file; do
              filename=$(basename "$file")
              
              # Skip specific system files
              if [[ "$filename" != "README.md" && "$filename" != "_sidebar.md" ]]; then
                # Get first H1 title, or fallback to filename
                title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "")
                if [ -z "$title" ]; then
                  title="${filename%.md}"
                fi
                
                # Link is relative to the sidebar location (inside /notes/)
                echo "* [$title](entries/${filename%.md})" >> $SIDEBAR_FILE
              fi
            done
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get the latest commit hash from the submodule for the message
          SUB_HASH=$(cd notes_submodule && git rev-parse --short HEAD)
          
          git add notes/
          git add notes_submodule
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync notes: updated to $SUB_HASH and refreshed sidebar"
            git push
          fi