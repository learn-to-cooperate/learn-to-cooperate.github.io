name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge

      - name: Force Extract Submodule to Physical Folder
        run: |
          # 1. Get the submodule files
          git submodule update --init --recursive
          
          # 2. Move them to a completely neutral location outside the workspace
          mkdir -p ../temp_flat_notes
          cp -r notes/* ../temp_flat_notes/
          
          # 3. DELETE the entire notes folder from the repo to kill the nesting
          git rm -rf notes || rm -rf notes
          
          # 4. Recreate the clean structure from scratch
          mkdir -p notes/entries
          
          # 5. Move CONTENTS (not the folder) into the target
          # The dot at the end of the source ensures we take only the contents
          cp -r ../temp_flat_notes/. notes/entries/
          
          # 6. Final safety check: remove any accidentally copied sub-entries
          rm -rf notes/entries/entries

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](notes.html#/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # Look specifically in the new clean folder
          if [ -d "notes/entries" ]; then
            find notes/entries/ -maxdepth 1 -name "*.md" ! -name "README.md" | sort | while read file; do
              filename=$(basename "$file")
              # Link relative to notes.html basePath '/'
              echo "* [${filename%.md}](notes/entries/${filename%.md})" >> $SIDEBAR_FILE
            done
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # We force add because we want to turn the submodule into a folder
          git add _sidebar.md notes/
          git diff-index --quiet HEAD || (git commit -m "fix: extract submodule to folder and update sidebar" && git push)
