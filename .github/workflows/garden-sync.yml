name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge
          
      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          
          # 1. Static Links
          # Pointing to index.html in root and / for Docsify home
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # 2. Generate links from the actual submodule path
          # We look in notes/entries/ but keep the link clean for Docsify
          if [ -d "notes/entries" ]; then
            find notes/entries/ -maxdepth 1 -name "*.md" ! -name "README.md" | sort | while read file; do
              filename=$(basename "$file")
              linkname="${filename%.md}"
              # Try to grab the first H1 for the title, fallback to filename
              title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "$linkname")
              echo "* [$title]($linkname)" >> $SIDEBAR_FILE
            done
          else
            echo "Warning: notes/entries directory not found!"
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Only commit if the sidebar or submodule pointer actually changed
          git diff-index --quiet HEAD || (git commit -m "Update notes submodule and sidebar" && git push)