name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.MY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule sync               # <--- Add this to fix URL cache issues
          git submodule update --init --recursive --force
          git submodule update --remote --merge

      - name: Sync Files to Real Folder
        run: |
          mkdir -p notes/entries
          if [ -d "notes_submodule/entries" ]; then
            cp -a notes_submodule/entries/. notes/entries/
          else
            echo "Error: notes_submodule/entries not found!"
            # Helpful debug: show what actually exists
            ls -R
            exit 1
          fi

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="notes/_sidebar.md"
          HOME_FILE="notes/README.md"

          # 1. Create a Home Page if it doesn't exist
          if [ ! -f "$HOME_FILE" ]; then
            echo "# 📓 My Digital Garden" > $HOME_FILE
            echo "" >> $HOME_FILE
            echo "Welcome to my notes collection. Use the sidebar to browse by topic." >> $HOME_FILE
          fi

          # 2. Start Sidebar Generation
          echo "* [🏠 Main Portfolio](index.html :ignore)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](README.md)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          if [ -d "notes/entries" ]; then
            find notes/entries -name "*.md" | sort | while read -r file; do
              filename=$(basename "$file")
              if [[ "$filename" != "README.md" && "$filename" != "_sidebar.md" ]]; then
                title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "")
                if [ -z "$title" ]; then
                  title="${filename%.md}"
                fi
                echo "* [$title](entries/${filename%.md})" >> $SIDEBAR_FILE
              fi
            done
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use || true to prevent failure if submodule folder is weirdly empty
          SUB_HASH=$(cd notes_submodule && git rev-parse --short HEAD || echo "unknown")
          
          git add notes/
          git add notes_submodule
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync notes: updated to $SUB_HASH and refreshed sidebar"
            git push
          fi