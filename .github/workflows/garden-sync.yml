name: Sync Notes and Generate Sidebar
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --merge

- name: Force Extract Submodule to Physical Folder
        run: |
          # 1. Initialize and FORCE update the submodule
          git submodule update --init --recursive --force
          
          # 2. Debug: List what is actually inside 'notes' so we can see it in the logs
          echo "Checking submodule content:"
          ls -R notes
          
          # 3. Create target
          mkdir -p notes_new/entries
          
          # 4. Copying with a 'dot' to ensure hidden files and subfolders are caught
          # We use /notes/. to signify "everything inside the notes folder"
          cp -r notes/. notes_new/entries/
          
          # 5. Prevent the disappearing folder trick
          touch notes_new/entries/.gitkeep
          
          # 6. Swap the 'gitlink' for the real folder
          git rm -rf notes || rm -rf notes
          mv notes_new notes
          
          # 7. Cleanup the mess
          rm -rf notes/entries/.git # Remove the submodule's internal git history
          rm -rf notes/entries/entries # Remove accidental nesting

      - name: Generate Sidebar
        run: |
          SIDEBAR_FILE="_sidebar.md"
          echo "* [🏠 Main Portfolio](index.html)" > $SIDEBAR_FILE
          echo "* [📂 Notes Home](notes.html#/)" >> $SIDEBAR_FILE
          echo "" >> $SIDEBAR_FILE
          echo "---" >> $SIDEBAR_FILE
          
          # Use a simple loop that doesn't care about directory depth
          if [ -d "notes/entries" ]; then
            for file in notes/entries/*.md; do
              [ -e "$file" ] || continue
              filename=$(basename "$file")
              if [ "$filename" != "README.md" ]; then
                title=$(grep -m 1 '^# ' "$file" | sed 's/^# //' || echo "${filename%.md}")
                echo "* [$title](notes/entries/${filename%.md})" >> $SIDEBAR_FILE
              fi
            done
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FORCE add the notes folder so Git sees it as a folder, not a submodule
          git add -f notes/
          git add _sidebar.md
          git commit -m "chore: flatten notes structure and update sidebar" || echo "No changes to commit"
          git push origin main
          git diff-index --quiet HEAD || (git commit -m "fix: extract submodule to folder and update sidebar" && git push)
